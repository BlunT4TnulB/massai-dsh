# Render blueprint — Massai hosted link.
# The image is built in GitHub Actions (7GB RAM) and pushed to GHCR; Render pulls it.
# The app reads $PORT (Render sets it) and binds 0.0.0.0 in hosted mode.
services:
  - type: web
    name: massai
    runtime: image
    image:
      url: ghcr.io/blunt4tnulb/massai:latest
    plan: free
    healthCheckPath: /healthz
