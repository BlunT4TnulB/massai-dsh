# Render blueprint — Massai hosted link.
# The image is built in GitHub Actions (7GB RAM; Render's builder OOMs on the
# client build) and pushed to GHCR; Render just pulls it.
services:
  - type: web
    name: massai
    runtime: image
    image:
      url: ghcr.io/blunt4tnulb/massai:latest
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3080"
