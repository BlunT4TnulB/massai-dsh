<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz</title>
<style>
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0a0b0d;color:#EDE7DA;font:16px/1.6 system-ui,sans-serif;padding:18px}
main{width:min(30rem,100%)}
.q{font-size:1.1rem;margin:0 0 1rem}
button{display:block;width:100%;text-align:left;margin:.4rem 0;padding:.7rem .9rem;border-radius:10px;border:1px solid #2e2a24;background:#14120f;color:#EDE7DA;font:inherit;cursor:pointer}
button:hover{border-color:#8a5f2c}
button.ok{border-color:#4caf72;background:#12211a}
button.bad{border-color:#c1440e;background:#21110c}
.meta{display:flex;justify-content:space-between;color:#8f8574;font-size:.8rem;letter-spacing:.08em}
h1{font-size:.72rem;letter-spacing:.3em;color:#9b8f78;text-transform:uppercase;margin:0 0 1rem}
</style></head><body><main>
<h1>Five questions</h1>
<div class="meta"><span id="count"></span><span id="score"></span></div>
<div id="stage"></div>
</main>
<script>
const QUESTIONS = [
  { q: 'Which is a planet?', options: ['Mars', 'The Moon', 'The Sun', 'Pluto'], answer: 0 },
  { q: 'What does a barometer measure?', options: ['Wind', 'Pressure', 'Humidity', 'Rain'], answer: 1 },
  { q: 'Which language does a browser run directly?', options: ['Python', 'JavaScript', 'Go', 'Rust'], answer: 1 },
  { q: 'Half of 96, then plus 4?', options: ['46', '50', '52', '48'], answer: 2 },
  { q: 'Which is not a metal?', options: ['Iron', 'Copper', 'Carbon', 'Zinc'], answer: 2 }
]
let index = 0
let score = 0
const stage = document.getElementById('stage')
const paint = () => {
  document.getElementById('count').textContent = 'question ' + Math.min(index + 1, QUESTIONS.length) + ' of ' + QUESTIONS.length
  document.getElementById('score').textContent = 'score ' + score
  if (index >= QUESTIONS.length) {
    stage.innerHTML = '<p class="q">' + score + ' of ' + QUESTIONS.length + '. ' + (score === QUESTIONS.length ? 'Clean sweep.' : 'Worth another pass.') + '</p>'
    const again = document.createElement('button'); again.textContent = 'Start again'; again.addEventListener('click', () => { index = 0; score = 0; paint() }); stage.append(again)
    return
  }
  const item = QUESTIONS[index]
  stage.innerHTML = '<p class="q">' + item.q + '</p>'
  item.options.forEach((option, at) => {
    const button = document.createElement('button'); button.textContent = option
    button.addEventListener('click', () => {
      button.classList.add(at === item.answer ? 'ok' : 'bad')
      if (at === item.answer) score += 1
      index += 1
      setTimeout(paint, 420)
    })
    stage.append(button)
  })
}
paint()
</script></body></html>
