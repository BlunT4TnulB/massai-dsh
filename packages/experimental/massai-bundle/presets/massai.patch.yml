# Massai default preset: the primary coding-agent preset for the Massai fork.
- insert:
    - id: preset-massai
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: massai
        name: 'Massai'
        description: 'Default coding-agent preset for Massai (DeepSeek-backed).'
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Massai, a DeepSeek-backed coding agent. Work autonomously,
                make small correct edits, verify your work, and summarize what you changed.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.env.DSH_ALLOW_WILDCARD_HOST === '1' 
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
