<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="gold" x1="0.05" y1="0" x2="0.95" y2="1">
    <stop offset="0%" stop-color="#FFFBE8"/><stop offset="18%" stop-color="#F3DE9E"/>
    <stop offset="48%" stop-color="#D2A945"/><stop offset="78%" stop-color="#9A6E1C"/>
    <stop offset="100%" stop-color="#6B470C"/>
  </linearGradient>
  <linearGradient id="fil" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="14%" stop-color="#FFF7D2"/>
    <stop offset="50%" stop-color="#EFCE7A"/><stop offset="100%" stop-color="#8E6516"/>
  </linearGradient>
  <radialGradient id="bloom" cx="0.5" cy="0.42" r="0.55">
    <stop offset="0%" stop-color="#FFFDF2" stop-opacity=".95"/>
    <stop offset="24%" stop-color="#FFEFB8" stop-opacity=".55"/>
    <stop offset="60%" stop-color="#E0B457" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#E0B457" stop-opacity="0"/>
  </radialGradient>

  <!-- hammered-metal grain: turbulence lit from the top-left -->
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#FFE9A8" surfaceScale="1.6" result="lit">
      <feDistantLight azimuth="235" elevation="58"/>
    </feDiffuseLighting>
    <feComposite in="lit" in2="SourceGraphic" operator="in" result="tex"/>
    <feBlend in="SourceGraphic" in2="tex" mode="overlay"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="16" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- the whole sigil, so it can be reused as a clip and a glow source -->
  <g id="shape">
    <path d="M58 148 C 100 84 176 60 256 88 C 336 60 412 84 454 148
             C 398 108 330 96 256 120 C 182 96 114 108 58 148 Z"/>
    <rect x="247" y="104" width="18" height="342" rx="9"/>
    <path d="M96 238 h320 a34 34 0 0 1 0 68 h-320 a34 34 0 0 1 0 -68 Z"/>
    <path d="M164 418 H 348 C 358 450 394 474 438 488 H 74 C 118 474 154 450 164 418 Z"/>
  </g>
</defs>

<rect width="512" height="512" fill="#070709"/>
<!-- discharge bloom -->
<ellipse cx="256" cy="190" rx="168" ry="132" fill="url(#bloom)"/>

<!-- glow pass, then the metal pass -->
<g filter="url(#glow)" opacity=".55"><use href="#shape" fill="#F0CE7C"/></g>
<g filter="url(#grain)"><use href="#shape" fill="url(#gold)"/></g>

<!-- filament on top: the current itself -->
<rect x="247" y="104" width="18" height="342" rx="9" fill="url(#fil)"/>

<!-- eyes, punched crisply -->
<circle cx="168" cy="272" r="25" fill="#070709"/>
<circle cx="344" cy="272" r="25" fill="#070709"/>
<circle cx="168" cy="272" r="25" fill="none" stroke="#FFEFC0" stroke-width="2.5" opacity=".8"/>
<circle cx="344" cy="272" r="25" fill="none" stroke="#FFEFC0" stroke-width="2.5" opacity=".8"/>

<!-- rim light: the artefact is lit from the upper left -->
<path d="M58 148 C 100 84 176 60 256 88 C 336 60 412 84 454 148"
      fill="none" stroke="#FFFDF0" stroke-width="2.5" opacity=".75"/>
<path d="M96 238 h320" fill="none" stroke="#FFFDF0" stroke-width="2.5" opacity=".45"/>
<path d="M74 488 h364" fill="none" stroke="#FFEBB0" stroke-width="2" opacity=".35"/>
</svg>