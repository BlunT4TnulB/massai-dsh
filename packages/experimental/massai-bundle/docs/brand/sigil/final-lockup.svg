<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 512" width="1100" height="512">
<defs><linearGradient id="gold" x1="0.05" y1="0" x2="0.95" y2="1">
    <stop offset="0%" stop-color="#FFFBE8"/><stop offset="16%" stop-color="#F5E2A8"/>
    <stop offset="46%" stop-color="#D5AC49"/><stop offset="76%" stop-color="#9A6E1C"/>
    <stop offset="100%" stop-color="#6B470C"/>
  </linearGradient>
  <linearGradient id="fil" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/><stop offset="16%" stop-color="#FFF7D2"/>
    <stop offset="52%" stop-color="#EFCE7A"/><stop offset="100%" stop-color="#8E6516"/>
