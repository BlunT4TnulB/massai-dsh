<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" fill="none">
  <!-- bead halo: gold ring with Maasai-red dots (still legible when small) -->
  <ellipse cx="60" cy="10" rx="26" ry="8" fill="#C9A227" opacity=".12"/>
  <ellipse cx="60" cy="10" rx="21" ry="5.6" fill="none" stroke="#C9A227" stroke-width="3"/>
  <g fill="#B22222">
    <circle cx="60" cy="4.6" r="1.5"/><circle cx="44" cy="6.4" r="1.5"/><circle cx="76" cy="6.4" r="1.5"/>
    <circle cx="36" cy="10" r="1.5"/><circle cx="84" cy="10" r="1.5"/>
  </g>
  <!-- crossed spears -->
  <path d="M16 100L104 22M104 100L16 22" stroke="#C1440E" stroke-width="3.2" stroke-linecap="round" opacity=".65"/>
  <path d="M104 22l-10 2 8 8zM16 22l10 2-8 8z" fill="#C1440E" opacity=".65"/>
  <!-- shield whose point becomes a whale fluke -->
  <path d="M60 16c24 0 35 14 35 33 0 24-17 40-28 46 4 6 8 11 8 11s-9-4-15-4-15 4-15 4 4-5 8-11c-11-6-28-22-28-46 0-19 11-33 35-33z"
        fill="#151517" stroke="#C1440E" stroke-width="5"/>
  <!-- the whale (pixel, reads at 16px) -->
  <g fill="#4D6BFE" transform="translate(35 48) scale(2.6)">
    <rect x="2" y="3" width="4" height="1"/><rect x="2" y="4" width="9" height="1"/>
    <rect x="2" y="5" width="10" height="1"/><rect x="3" y="6" width="7" height="1"/>
    <rect x="11" y="3" width="1" height="1"/><rect x="12" y="2" width="1" height="2"/>
    <rect x="13" y="1" width="1" height="2"/><rect x="12" y="4" width="2" height="2"/>
    <rect x="13" y="5" width="1" height="2"/><rect x="6" y="1" width="1" height="2"/>
    <rect x="6" y="0" width="1" height="1"/>
  </g>
</svg>
