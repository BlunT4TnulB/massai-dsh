# Guided start: `?prompt=` deep links open a conversation ready to build.
- insert:
    - id: quickstart
      name: "@deepseek-ai/dsh-client-ui-quickstart"

# The worker pool: local models on your own machines, reached through the hub's
# relay. Selectable by hand — a provider whose machine is asleep must never be
# picked automatically, or a request would wait for a worker that isn't there.
- insert:
    - id: llm-worker
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          massai-worker:
            displayName: Worker pool (local machines)
            apiKeyEnv: DSH_WORKER_TOKEN
            api: openai-completions
            baseURL: https://massai-dsh.onrender.com/api/local/v1
            models:
              - id: auto
                name: Any connected machine
                contextWindow: 32768
                maxTokens: 4096

# Bring your DeepSeek website history in: upload the deepseek_data-*.zip export
# and its recent conversations become sessions here, with titles, questions,
# reasoning, web-search cards and answers preserved. This is the one place
# DeepSeek's own chat app feeds us rather than the other way round.
- insert:
    - id: deepseek-chat-import
      name: '@deepseek-ai/dsh-deepseek-chat-import'
