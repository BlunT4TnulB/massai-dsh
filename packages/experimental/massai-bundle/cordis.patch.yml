# Revamp bundle patch: cost-aware defaults for the forked DSH.
# Keeps DeepSeek-V4-Pro as the main-agent default (best coding quality).
# Uncomment the second entry to default the main agent to Flash (cheaper/faster).
- id: llm-deepseek
  config:
    # Replaying every reasoning block makes long sessions 2-3x larger in context
    # (measured: 60% of assistant content) and it is re-read on every call. Keep
    # the reasoning the active tool chain needs; drop finished turns.
    historyReasoning: current-turn

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    # Start on the cheap tier and let the router climb: the model is escalated
    # per step on hard signals (big new work, failing tool loops, hard wording).
    # Defaulting to pro was paying flagship rates for every greeting.
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: low

# Expose the cai DeepSeek coding agent as a model-facing tool.
- insert:
    - id: tool-cai
      name: "@deepseek-ai/dsh-tool-cai"

# Expose one-way rclone sync as a model-facing tool.
- insert:
    - id: tool-sync
      name: "@deepseek-ai/dsh-tool-sync"

# Cost-aware model routing (decision engine + route_model tool).
- insert:
    - id: model-router
      name: "@deepseek-ai/dsh-model-router"
      config:
        mode: auto
        cheapModel: deepseek-flash
        qualityModel: deepseek-v4-pro
        visionModel: deepseek-flash
        routeProvider: deepseek-official
        ceilingTokens: 45000

# Account connectors (store/list credentials in the vault).
- insert:
    - id: account-connect
      name: "@deepseek-ai/dsh-account-connect"

# Embedded SQLite database (persistent structured storage for the agent).
- insert:
    - id: tool-sqlite
      name: "@deepseek-ai/dsh-tool-sqlite"

# Generic HTTP requests (optional vault-credential auth).
- insert:
    - id: tool-http
      name: "@deepseek-ai/dsh-tool-http"

# Per-user credentials (hosted-link foundation: each visitor's own DeepSeek key).
- insert:
    - id: user-credentials
      name: "@deepseek-ai/dsh-user-credentials"

# Hosted-link BYOK sign-in (POST /api/signin stores the visitor's key).
- insert:
    - id: hosted-signin
      name: "@deepseek-ai/dsh-hosted-signin"

