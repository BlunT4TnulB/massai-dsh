# Revamp bundle patch: cost-aware defaults for the forked DSH.
# Keeps DeepSeek-V4-Pro as the main-agent default (best coding quality).
# Uncomment the second entry to default the main agent to Flash (cheaper/faster).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    reasoningEffort: high

# Expose the cai DeepSeek coding agent as a model-facing tool.
- insert:
    - id: tool-cai
      name: "@deepseek-ai/dsh-tool-cai"

