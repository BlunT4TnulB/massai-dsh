# `npx wrangler deploy` from this folder does script + cron in one step, which
# sidesteps the REST quirk where a token holding only Workers Scripts:Edit can
# upload the script but gets 10026 on the /schedules endpoint.
name = "massai-keepalive"
main = "worker.js"
compatibility_date = "2026-01-01"

[triggers]
crons = ["*/5 * * * *"]
