# The free Render instance sleeps after ~15 minutes idle, and the first request
# then takes ~22 s to wake it — which reads as "the site is broken". One ping
# every ten minutes keeps it warm inside the free instance-hours budget.
name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 90 -w '%{http_code}' https://massai-dsh.onrender.com/healthz || true)
            echo "attempt $i → $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "service did not answer"; exit 1
