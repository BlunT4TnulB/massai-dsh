name: Massai CI

# Light, additive gate for the fork: verifies the revamp still typechecks.
# (Upstream's heavy `check:ci` lanes need self-hosted runners + bubblewrap;
#  this lane is the fast "does it compile" signal for our changes.)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Dump web server flags (for Dockerfile)
        run: node --import tsx/esm apps/cli/src/bin.ts web --help 2>&1 | head -60 || true

      - name: Typecheck
        run: pnpm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify cordis config (bundle patches + presets)
        run: pnpm run verify-cordis-config

      - name: Commit regenerated lockfile
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Massai CI"
          git config user.email "ci@massai.local"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile unchanged"
          else
            git commit -m "chore: regenerate pnpm-lock.yaml"
            git push origin HEAD:master
          fi

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deepseek-auth tests (incl. per-user isolation)
        run: pnpm exec vitest run packages/account/deepseek-auth

  # Build the hosted-link image on a big runner (Render's 512MB builder OOMs on
  # the client build) and push it to GHCR; Render pulls the prebuilt image.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'pull_request'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ghcr.io/blunt4tnulb/massai:latest .
          docker push ghcr.io/blunt4tnulb/massai:latest

      - name: Smoke-test the image (bind + /healthz)
        run: |
          docker run -d --name massai-smoke -p 10000:10000 ghcr.io/blunt4tnulb/massai:latest
          CODE=000
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/healthz 2>/dev/null || echo 000)
            echo "healthz(loopback-mapped) attempt $i: $CODE"
            [ "$CODE" = "200" ] && break
            sleep 4
          done
          # Simulate Render's scanner: hit the CONTAINER's own IP (not the -p mapping).
          CIP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' massai-smoke)
          echo "container IP: $CIP"
          echo "container-ip /healthz: $(curl -s -o /dev/null -w '%{http_code}' "http://$CIP:10000/healthz" 2>/dev/null || echo 000)"
          echo "container-ip /: $(curl -s -o /dev/null -w '%{http_code}' "http://$CIP:10000/" 2>/dev/null || echo 000)"
          # The token auth must be ACTIVE: a bogus token gets 401, never the anonymous 200 fallback.
          TOKEN_CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://$CIP:10000/?token=BOGUS" 2>/dev/null || echo 000)
          echo "container-ip /?token=BOGUS: $TOKEN_CODE"
          [ "$TOKEN_CODE" = "401" ] || { echo "SMOKE=FAIL (token auth inactive: $TOKEN_CODE)"; exit 1; }
          echo "--- listening sockets ---"
          docker exec massai-smoke sh -c 'cat /proc/net/tcp 2>/dev/null | head -5' || true
          echo "--- container logs ---"
          docker logs massai-smoke 2>&1 | tail -15
          docker rm -f massai-smoke
          [ "$CODE" = "200" ] && echo "SMOKE=PASS" || { echo "SMOKE=FAIL"; exit 1; }

  # Mirror every push to the identical private twin (massai-private).
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Push full mirror to private twin
        run: |
          git remote add twin "https://x-access-token:${MIRROR_TOKEN}@github.com/BlunT4TnulB/massai-private.git"
          git push --mirror twin
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
