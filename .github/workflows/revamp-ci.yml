name: Massai CI

# Light, additive gate for the fork: verifies the revamp still typechecks.
# (Upstream's heavy `check:ci` lanes need self-hosted runners + bubblewrap;
#  this lane is the fast "does it compile" signal for our changes.)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        # Frozen now that the fork's packages are committed to pnpm-lock.yaml.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Verify cordis config (bundle patches + presets)
        run: pnpm run verify-cordis-config

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
